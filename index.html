<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Pro Shuffler</title>
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --danger: #d93025; --bg: #f0f2f5; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; position: relative; overflow: hidden; }
        
        h2 { text-align: center; color: #202124; margin-bottom: 20px; font-weight: 800; }
        
        /* Shuffling Overlay Animation */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 10;
        }
        .shuttle { font-size: 50px; animation: bounce 0.5s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-20px) rotate(20deg); } }

        /* Input Styles */
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex-grow: 1; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        .btn-add { background: var(--success); color: white; border: none; border-radius: 12px; padding: 0 20px; font-weight: bold; }

        /* Court Styles */
        .btn-shuffle { background: var(--primary); color: white; width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 1.1em; font-weight: bold; margin-bottom: 20px; cursor: pointer; }
        .court-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .court { background: #f8faff; padding: 15px; border-radius: 15px; border: 2px solid #e8f0fe; min-height: 100px; text-align: center; opacity: 1; transition: opacity 0.5s ease-in; }
        .court h3 { margin: 0 0 10px 0; font-size: 0.7em; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        .match-text { font-weight: bold; font-size: 1em; line-height: 1.5; color: #3c4043; }
        .vs { color: var(--danger); font-size: 0.7em; display: block; margin: 2px 0; }

        /* List Styles */
        .player-list-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .player-item { background: #fff; margin-bottom: 8px; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; border: 1px solid #f0f0f0; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .remove-btn { color: #bdc1c6; cursor: pointer; }
        .clear-link { display: block; text-align: center; margin-top: 20px; color: #9aa0a6; font-size: 0.8em; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="loader">
        <div class="shuttle">🏸</div>
        <p><b>Shuffling Players...</b></p>
    </div>

    <h2>Match Maker</h2>
    
    <div class="input-group">
        <input type="text" id="nameInput" placeholder="Add Player Name" autocomplete="off">
        <button class="btn-add" onclick="addPlayer()">Add</button>
    </div>

    <button class="btn-shuffle" onclick="startShuffle()">Shuffle Courts</button>

    <div class="court-grid">
        <div class="court" id="c1box">
            <h3>Court 1</h3>
            <div id="court1" class="match-text">--</div>
        </div>
        <div class="court" id="c2box">
            <h3>Court 2</h3>
            <div id="court2" class="match-text">--</div>
        </div>
    </div>

    <div class="player-list-section">
        <div style="display:flex; justify-content: space-between; margin-bottom: 10px;">
            <small><b>PLAYERS</b></small>
            <small id="count">0</small>
        </div>
        <div id="playerPool"></div>
        <span class="clear-link" onclick="clearAll()">Clear All Players</span>
    </div>
</div>

<script>
    let players = JSON.parse(localStorage.getItem('badmintonPlayers')) || [];
    window.onload = renderPlayers;

    document.getElementById('nameInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') addPlayer(); });

    function addPlayer() {
        const input = document.getElementById('nameInput');
        const name = input.value.trim();
        if (name) {
            players.push(name);
            input.value = '';
            save();
            renderPlayers();
        }
    }

    function removePlayer(i) { players.splice(i, 1); save(); renderPlayers(); }
    function save() { localStorage.setItem('badmintonPlayers', JSON.stringify(players)); }

    function renderPlayers() {
        document.getElementById('count').innerText = players.length;
        document.getElementById('playerPool').innerHTML = players.map((p, i) => `
            <div class="player-item"><span>${p}</span> <span class="remove-btn" onclick="removePlayer(${i})">✕</span></div>
        `).reverse().join('');
    }

    function startShuffle() {
        if (players.length < 4) return alert("Add at least 4 players!");
        
        // Show Animation
        const loader = document.getElementById('loader');
        const c1 = document.getElementById('c1box');
        const c2 = document.getElementById('c2box');
        
        loader.style.display = 'flex';
        c1.style.opacity = '0';
        c2.style.opacity = '0';

        // Wait 1.5 seconds then show results
        setTimeout(() => {
            generateCourts();
            loader.style.display = 'none';
            c1.style.opacity = '1';
            c2.style.opacity = '1';
        }, 1500);
    }

    function generateCourts() {
        let s = [...players].sort(() => Math.random() - 0.5);
        
        document.getElementById('court1').innerHTML = `${s[0]} & ${s[1]} <span class="vs">VS</span> ${s[2]} & ${s[3]}`;
        
        if (s.length >= 8) {
            document.getElementById('court2').innerHTML = `${s[4]} & ${s[5]} <span class="vs">VS</span> ${s[6]} & ${s[7]}`;
        } else {
            document.getElementById('court2').innerHTML = `<span style="color:#bdc3c7; font-weight:normal;">Waiting...</span>`;
        }
    }

    function clearAll() {
        if (confirm("Clear player list?")) {
            players = []; save(); renderPlayers();
            document.getElementById('court1').innerText = "--";
            document.getElementById('court2').innerText = "--";
        }
    }
</script>

</body>
</html>
