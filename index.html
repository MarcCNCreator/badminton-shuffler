<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Pro Manager</title>
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --danger: #d93025; --bg: #f8f9fa; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 15px; margin: 0; color: #3c4043; }
        .container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; position: relative; }
        
        /* High-Five Animation */
        #highFiveOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        .animation-box { background: white; padding: 40px; border-radius: 30px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .players-wrap { display: flex; justify-content: center; gap: 20px; font-size: 60px; }
        .player-left { animation: slideRight 0.6s forwards; }
        .player-right { animation: slideLeft 0.6s forwards; }
        @keyframes slideRight { 0% { transform: translateX(-100px); } 100% { transform: translateX(0px); } }
        @keyframes slideLeft { 0% { transform: translateX(100px); } 100% { transform: translateX(0px); } }

        /* UI Elements */
        .btn { padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-add { background: var(--success); color: white; width: 100%; margin-top: 10px; }
        .btn-shuffle { background: var(--primary); color: white; width: 100%; font-size: 1.1em; margin-bottom: 20px; }
        
        .court { background: #fff; padding: 15px; border-radius: 15px; border: 2px solid #e8f0fe; text-align: center; margin-bottom: 15px; }
        .swap-select { background: #e8f0fe; border: 1px solid #1a73e8; border-radius: 6px; padding: 4px; font-weight: 600; color: #1a73e8; margin: 2px; width: 120px; font-size: 0.85em; }
        
        .section-title { font-size: 0.75em; font-weight: bold; color: #70757a; margin-top: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .resting-box { background: #fff3e0; padding: 10px; border-radius: 12px; margin-bottom: 15px; font-size: 0.85em; }
        
        /* Leaderboard Table Styles */
        .leaderboard-header { display: flex; padding: 0 10px; margin-bottom: 5px; font-size: 0.7em; color: #999; font-weight: bold; text-transform: uppercase; }
        .col-name { flex: 2; }
        .col-stats { flex: 1; text-align: center; }
        .col-status { flex: 1; text-align: right; }
        
        .player-item { display: flex; background: #fff; padding: 10px; margin-bottom: 6px; border-radius: 12px; border: 1px solid #eee; align-items: center; }
        .status-toggle { padding: 4px 8px; border-radius: 20px; font-size: 0.65em; font-weight: 800; cursor: pointer; text-transform: uppercase; display: inline-block; }
        .status-in { background: #e6f4ea; color: #1e8e3e; border: 1px solid #1e8e3e; }
        .status-out { background: #fce8e6; color: #d93025; border: 1px solid #d93025; }

        .score-row { display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 10px; }
        .score-row input { width: 45px; padding: 8px; text-align: center; border: 1px solid #ccc; border-radius: 8px; }
        
        .history-item { background: #fff; border: 1px solid #eee; padding: 10px; border-radius: 10px; margin-bottom: 5px; font-size: 0.8em; display: flex; justify-content: space-between; align-items: center; }
        #loader { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:20; border-radius:20px; }
    </style>
</head>
<body>

<div id="highFiveOverlay">
    <div class="animation-box">
        <div class="players-wrap"><div class="player-left">🧑‍🏸</div><div class="player-right">🏸👧</div></div>
        <h3 style="margin:0; color:#1a73e8;">Let's Play!</h3>
    </div>
</div>

<div class="container">
    <div id="loader">🏸<br><b>Shuffling...</b></div>
    <h2>Badminton Match Pro</h2>
    
    <div style="margin-bottom: 15px;">
        <input type="text" id="nameInput" placeholder="Names (e.g. Ali, Bob, Ken)" style="width: 100%; box-sizing: border-box; padding: 12px; border-radius: 12px; border: 1px solid #ddd;">
        <button class="btn btn-add" onclick="addPlayers()">Add to Session</button>
    </div>

    <button class="btn btn-shuffle" onclick="startShuffle()">Smart Shuffle (Fair Play)</button>

    <div class="section-title">🏖️ Resting / Offline</div>
    <div id="restingList" class="resting-box">No one resting.</div>

    <div id="courts">
        <div id="court1Box" class="court"><div id="c1_display">Court 1</div><div id="c1_score_ui"></div></div>
        <div id="court2Box" class="court"><div id="c2_display">Court 2</div><div id="c2_score_ui"></div></div>
    </div>

    <div class="section-title">🏆 Rankings</div>
    <div class="leaderboard-header">
        <div class="col-name">Player</div>
        <div class="col-stats">Games</div>
        <div class="col-stats">Points</div>
        <div class="col-status">Status</div>
    </div>
    <div id="playerPool"></div>

    <div class="section-title">📜 History</div>
    <div id="historyLog"></div>
    
    <button onclick="clearData()" style="width:100%; background:none; border:none; color:#bbb; font-size:0.7em; cursor:pointer; margin-top:20px;">Reset All Data</button>
</div>

<script>
    let players = JSON.parse(localStorage.getItem('badmintonData')) || [];
    let history = JSON.parse(localStorage.getItem('badmintonHistory')) || [];

    window.onload = () => { renderPlayers(); renderHistory(); };

    function addPlayers() {
        const input = document.getElementById('nameInput');
        const names = input.value.split(',').map(n => n.trim()).filter(n => n !== "");
        names.forEach(n => { 
            if (!players.find(p => p.name === n)) players.push({ name: n, points: 0, played: 0, status: 'IN' }); 
        });
        input.value = ''; save(); renderPlayers();
    }

    function toggleStatus(index) {
        players[index].status = players[index].status === 'IN' ? 'OUT' : 'IN';
        save(); renderPlayers();
    }

    function save() { 
        localStorage.setItem('badmintonData', JSON.stringify(players)); 
        localStorage.setItem('badmintonHistory', JSON.stringify(history));
    }

    function renderPlayers() {
        const sorted = [...players].sort((a,b) => b.points - a.points);
        document.getElementById('playerPool').innerHTML = sorted.map(p => {
            const idx = players.findIndex(orig => orig.name === p.name);
            return `
            <div class="player-item" style="opacity: ${p.status === 'IN' ? '1' : '0.5'}">
                <div class="col-name"><b>${p.name}</b></div>
                <div class="col-stats" style="color:#888">${p.played}</div>
                <div class="col-stats" style="font-weight:bold; color:var(--primary);">${p.points}</div>
                <div class="col-status">
                    <div class="status-toggle ${p.status === 'IN' ? 'status-in' : 'status-out'}" onclick="toggleStatus(${idx})">${p.status}</div>
                </div>
            </div>`;
        }).join('');
    }

    function startShuffle() {
        let activePlayers = players.filter(p => p.status === 'IN');
        if (activePlayers.length < 4) return alert("Need 4 checked-in players!");
        
        document.getElementById('loader').style.display = 'flex';
        setTimeout(() => {
            let pool = [...activePlayers].sort((a,b) => a.played - b.played || a.points - b.points);
            setupMatch(1, pool.slice(0, 4));
            if (pool.length >= 8) setupMatch(2, pool.slice(4, 8));

            document.getElementById('loader').style.display = 'none';
            document.getElementById('highFiveOverlay').style.display = 'flex';
            setTimeout(() => { document.getElementById('highFiveOverlay').style.display = 'none'; }, 1500);
            updateResting(activePlayers);
        }, 1000);
    }

    function setupMatch(court, pList) {
        let options = players.filter(p => p.status === 'IN').map(p => p.name);
        let html = `<div style="margin-bottom:10px;">`;
        for(let i=0; i<4; i++) {
            html += `<select class="swap-select" id="c${court}_p${i}" onchange="updateResting(players.filter(p=>p.status==='IN'))">`;
            options.forEach(opt => {
                const selected = (pList[i] && opt === pList[i].name) ? 'selected' : '';
                html += `<option value="${opt}" ${selected}>${opt}</option>`;
            });
            html += `</select> ${i === 1 ? '<br><span style="font-size:0.7em; color:red; font-weight:bold;">VS</span><br>' : ''}`;
        }
        html += `</div>`;
        
        document.getElementById(`c${court}_display`).innerHTML = html;
        document.getElementById(`c${court}_score_ui`).innerHTML = `
            <div class="score-row">
                <input type="number" id="c${court}GA" placeholder="A"> : <input type="number" id="c${court}GB" placeholder="B">
            </div>
            <button class="btn btn-add" style="font-size:0.8em; background:var(--primary);" onclick="confirmMatch(${court})">Save Score</button>`;
    }

    function confirmMatch(court) {
        const p0 = document.getElementById(`c${court}_p0`).value;
        const p1 = document.getElementById(`c${court}_p1`).value;
        const p2 = document.getElementById(`c${court}_p2`).value;
        const p3 = document.getElementById(`c${court}_p3`).value;
        const sa = parseInt(document.getElementById(`c${court}GA`).value) || 0;
        const sb = parseInt(document.getElementById(`c${court}GB`).value) || 0;
        if (sa === 0 && sb === 0) return alert("Enter score!");
        processMatch(`${p0} & ${p1}`, `${p2} & ${p3}`, sa, sb);
        document.getElementById(`c${court}_display`).innerHTML = "Logged ✓";
        document.getElementById(`c${court}_score_ui`).innerHTML = "";
    }

    function processMatch(tA, tB, sa, sb) {
        let winner = sa > sb ? tA : tB;
        let loser = sa > sb ? tB : tA;
        history.push({ winner, loser, score: `${sa}-${sb}`, date: new Date().toLocaleTimeString() });
        [tA, tB].forEach(team => {
            team.split('&').map(n => n.trim()).forEach(name => {
                let p = players.find(pl => pl.name === name);
                if (p) { p.points += (team === winner ? 3 : 1); p.played++; }
            });
        });
        save(); renderPlayers(); renderHistory();
    }

    function updateResting(active) {
        const selects = Array.from(document.querySelectorAll('.swap-select')).map(s => s.value);
        const resting = active.filter(p => !selects.includes(p.name)).map(p => p.name);
        document.getElementById('restingList').innerHTML = resting.length ? resting.map(n => `<span class="player-tag">${n}</span>`).join('') : "No one resting.";
    }

    function renderHistory() {
        document.getElementById('historyLog').innerHTML = history.slice(-5).reverse().map((h, i) => `
            <div class="history-item">
                <div><b>${h.winner}</b> def. ${h.loser} (${h.score})</div>
                <div style="color:#ccc; cursor:pointer;" onclick="deleteHistory(${history.length - 1 - i})">🗑️</div>
            </div>`).join('');
    }

    function deleteHistory(index) {
        const m = history[index];
        [m.winner, m.loser].forEach(team => {
            team.split('&').map(n => n.trim()).forEach(name => {
                let p = players.find(pl => pl.name === name);
                if (p) { p.points -= (team === m.winner ? 3 : 1); p.played--; }
            });
        });
        history.splice(index, 1); save(); renderPlayers(); renderHistory();
    }

    function clearData() { if(confirm("Reset everything?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
